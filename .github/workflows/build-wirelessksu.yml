name: Build WirelessKSU KernelSU Module

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: "Kernel branch for headers"
        required: true
        type: choice
        options:
          - blu_spark-16-los
          - blu_spark-17
          - blu_spark-17-next

      LOCALVERSION:
        description: "Kernel localversion (must match running kernel). Example: AHK-Fire/v26.08.21-r12/ca0a3c7e4"
        required: true
        default: "AHK-Fire/v26.08.21-r12/ca0a3c7e4"

      MODULE_VERSION:
        description: "Module version tag"
        required: false
        default: "1.0.0"

env:
  KERNEL_REPO: https://github.com/ahksoft2/kernel_devices_google_common

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev lld clang llvm

      - name: Clone kernel source for headers
        run: |
          git clone -q --depth=1 ${{ env.KERNEL_REPO }} -b ${{ github.event.inputs.KERNEL_BRANCH }} /tmp/kernel

      - name: Prepare kernel headers with correct localversion
        run: |
          cd /tmp/kernel
          LOCALVERSION="${{ github.event.inputs.LOCALVERSION }}"
          echo "Setting CONFIG_LOCALVERSION to: -${LOCALVERSION}"
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          KCONFIG_CONFIG=$(find . -name ".config" -not -path "./.git/*" | head -1)
          echo "Config file: $KCONFIG_CONFIG"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-${LOCALVERSION}\"|" "$KCONFIG_CONFIG"
          sed -i 's|CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' "$KCONFIG_CONFIG"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          KCONFIG_CONFIG=$(find . -name ".config" -not -path "./.git/*" | head -1)
          grep "CONFIG_LOCALVERSION" "$KCONFIG_CONFIG"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

      - name: Build WirelessKSU module
        run: |
          chmod +x scripts/build-wirelessksu.sh
          bash scripts/build-wirelessksu.sh \
            "${{ github.event.inputs.LOCALVERSION }}" \
            "${{ github.event.inputs.MODULE_VERSION }}"

      - name: Verify module
        run: |
          echo "=== ZIP contents ==="
          unzip -l WirelessKSU.zip
          echo ""
          echo "=== module.prop ==="
          unzip -p WirelessKSU.zip WirelessKSU/module.prop
          echo ""
          KO_PATH=$(unzip -l WirelessKSU.zip | grep "rtl8188fu.ko" | awk '{print $4}' | head -1)
          if [ -n "$KO_PATH" ]; then
            unzip -p WirelessKSU.zip "$KO_PATH" > /tmp/rtl8188fu_check.ko
            echo "=== Module vermagic ==="
            strings /tmp/rtl8188fu_check.ko | grep vermagic
            rm /tmp/rtl8188fu_check.ko
          fi
          echo ""
          echo "=== ZIP size ==="
          ls -lh WirelessKSU.zip

      - name: Upload WirelessKSU module
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WirelessKSU-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          path: WirelessKSU.zip
          retention-days: 14
