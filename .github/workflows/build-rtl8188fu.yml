name: Build RTL8188FU Monitor Mode Driver

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: "Kernel branch for headers"
        required: true
        type: choice
        options:
          - blu_spark-16-los
          - blu_spark-17
          - blu_spark-17-next

env:
  KERNEL_REPO: https://github.com/ahksoft2/kernel_devices_google_common

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev lld clang llvm

      - name: Clone kernel source for headers
        run: |
          git clone -q --depth=1 ${{ env.KERNEL_REPO }} -b ${{ github.event.inputs.KERNEL_BRANCH }} /tmp/kernel

      - name: Prepare kernel headers
        run: |
          cd /tmp/kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

      - name: Clone and configure rtl8188fu driver
        run: |
          git clone https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cd /tmp/rtl8188fu
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/#define __PHYDM_FEATURES$/#define __PHYDM_FEATURES_H__/' hal/phydm/phydm_features.h
          echo "=== Monitor mode enabled ==="
          grep "CONFIG_WIFI_MONITOR" Makefile | head -3

      - name: Build module
        run: |
          cd /tmp/rtl8188fu
          make -C /tmp/kernel \
            M=$(pwd) \
            CONFIG_RTL8188FU=m \
            CONFIG_WIFI_MONITOR=y \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT" \
            modules 2>&1

      - name: Verify and package
        run: |
          echo "=== Built modules ==="
          find /tmp/rtl8188fu -name "*.ko" -exec ls -la {} \;

          mkdir -p release
          find /tmp/rtl8188fu -name "*.ko" -exec cp {} release/ \;
          mkdir -p release/firmware
          cp /tmp/rtl8188fu/firmware/rtl8188fufw.bin release/firmware/ 2>/dev/null || true

          cat > release/install.sh << 'INSTALL'
          #!/bin/sh
          KVER=$(uname -r)
          MODDIR="/lib/modules/${KVER}/extra"
          FWDIR="/lib/firmware/rtlwifi"
          echo "[*] Installing rtl8188fu driver for ${KVER}..."
          mkdir -p "${MODDIR}" "${FWDIR}"
          cp *.ko "${MODDIR}/"
          cp firmware/rtl8188fufw.bin "${FWDIR}/" 2>/dev/null
          depmod -a
          modprobe rtl8188fu
          echo "[+] Done. Enable monitor mode:"
          echo "    ip link set wlan1 down"
          echo "    iw dev wlan1 set type monitor"
          echo "    ip link set wlan1 up"
          INSTALL
          chmod +x release/install.sh

          cd release
          zip -9 -r $GITHUB_WORKSPACE/rtl8188fu-monitor.zip .

      - name: Upload module
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rtl8188fu-monitor-${{ github.run_number }}
          path: rtl8188fu-monitor.zip
          retention-days: 7
