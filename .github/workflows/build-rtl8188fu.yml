name: Build RTL8188FU Monitor Mode Driver

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: "Kernel branch for headers"
        required: true
        type: choice
        options:
          - blu_spark-16-los
          - blu_spark-17
          - blu_spark-17-next

      LOCALVERSION:
        description: "Kernel localversion (must match running kernel). Example: AHK-Fire/v26.08.21-r12/ca0a3c7e4"
        required: true
        default: "AHK-Fire/v26.08.21-r12/ca0a3c7e4"

env:
  KERNEL_REPO: https://github.com/ahksoft2/kernel_devices_google_common
  KERNEL_NAME: AHK-Fire

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev lld clang llvm

      - name: Clone kernel source for headers
        run: |
          git clone -q --depth=1 ${{ env.KERNEL_REPO }} -b ${{ github.event.inputs.KERNEL_BRANCH }} /tmp/kernel

      - name: Prepare kernel headers with correct localversion
        run: |
          cd /tmp/kernel
          LOCALVERSION="${{ github.event.inputs.LOCALVERSION }}"
          echo "Setting CONFIG_LOCALVERSION to: -${LOCALVERSION}"
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig O=/tmp/out_gs
          echo "Config file: /tmp/out_gs/.config"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-${LOCALVERSION}\"|" /tmp/out_gs/.config
          sed -i 's|CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' /tmp/out_gs/.config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig O=/tmp/out_gs
          grep "CONFIG_LOCALVERSION" /tmp/out_gs/.config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare O=/tmp/out_gs -j$(nproc)

      - name: Clone and configure rtl8188fu driver
        run: |
          git clone https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cd /tmp/rtl8188fu
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/#define __PHYDM_FEATURES$/#define __PHYDM_FEATURES_H__/' hal/phydm/phydm_features.h
          echo "=== Monitor mode enabled ==="
          grep "CONFIG_WIFI_MONITOR" Makefile | head -3

      - name: Build module
        run: |
          cd /tmp/rtl8188fu
          make -C /tmp/kernel \
            O=/tmp/out_gs \
            M=$(pwd) \
            CONFIG_RTL8188FU=m \
            CONFIG_WIFI_MONITOR=y \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -w" \
            modules 2>&1

      - name: Verify module vermagic
        run: |
          KO=$(find /tmp/rtl8188fu -name "rtl8188fu.ko" | head -1)
          if [ -z "$KO" ]; then
            echo "ERROR: rtl8188fu.ko not found!"
            exit 1
          fi
          echo "=== Module vermagic ==="
          strings "$KO" | grep vermagic
          echo ""
          echo "=== Expected localversion ==="
          echo "-${{ github.event.inputs.LOCALVERSION }}"
          echo ""
          echo "=== File size ==="
          ls -la "$KO"

      - name: Package module
        run: |
          KO=$(find /tmp/rtl8188fu -name "rtl8188fu.ko" | head -1)
          mkdir -p release/lkm
          mkdir -p release/system/etc/firmware/rtlwifi
          cp "$KO" release/lkm/
          cp /tmp/rtl8188fu/firmware/rtl8188fufw.bin release/system/etc/firmware/rtlwifi/ 2>/dev/null || true
          printf 'id=wirelessksu\nname=WirelessKSU - RTL8188FU Monitor Mode\nversion=%s\nversionCode=100\nauthor=AbirHasanAHK\ndescription=RTL8188FU WiFi driver with monitor mode for USB adapters (Pixel 6 Pro)\nminApi=28\n' "${{ github.event.inputs.LOCALVERSION }}" > release/module.prop
          chmod 755 release/post-fs-data.sh release/service.sh

      - name: Upload module
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WirelessKSU-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          path: release/
          retention-days: 14
