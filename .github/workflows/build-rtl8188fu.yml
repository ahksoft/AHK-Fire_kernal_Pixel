name: Build RTL8188FU Monitor Mode Driver

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: "Kernel branch for headers"
        required: true
        type: choice
        options:
          - blu_spark-16-los
          - blu_spark-17
          - blu_spark-17-next

      LOCALVERSION:
        description: "Kernel localversion (must match running kernel). Example: AHK-Fire/v26.08.21-r12/ca0a3c7e4"
        required: true
        default: "AHK-Fire/v26.08.21-r12/ca0a3c7e4"

env:
  KERNEL_REPO: https://github.com/ahksoft2/kernel_devices_google_common
  KERNEL_NAME: AHK-Fire

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev lld clang llvm

      - name: Clone kernel source for headers
        run: |
          git clone -q --depth=1 ${{ env.KERNEL_REPO }} -b ${{ github.event.inputs.KERNEL_BRANCH }} /tmp/kernel

      - name: Prepare kernel headers with correct localversion
        run: |
          cd /tmp/kernel
          LOCALVERSION="${{ github.event.inputs.LOCALVERSION }}"
          echo "Setting CONFIG_LOCALVERSION to: -${LOCALVERSION}"
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-${LOCALVERSION}\"|" .config 2>/dev/null || true
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-${LOCALVERSION}\"|" .config
          sed -i 's|CONFIG_LOCALVERSION_AUTO=y|CONFIG_LOCALVERSION_AUTO=n|' .config
          sed -i 's|CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' .config
          sed -i 's/echo "+"/# echo "+"/g' scripts/setlocalversion
          grep "CONFIG_LOCALVERSION" .config | head -3
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep "CONFIG_LOCALVERSION" .config | head -3
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

      - name: Clone and configure rtl8188fu driver
        run: |
          git clone https://github.com/kelebek333/rtl8188fu /tmp/rtl8188fu
          cd /tmp/rtl8188fu
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/#define __PHYDM_FEATURES$/#define __PHYDM_FEATURES_H__/' hal/phydm/phydm_features.h
          echo "=== Monitor mode enabled ==="
          grep "CONFIG_WIFI_MONITOR" Makefile | head -3

      - name: Build module
        run: |
          cd /tmp/rtl8188fu
          make -C /tmp/kernel \
            M=$(pwd) \
            CONFIG_RTL8188FU=m \
            CONFIG_WIFI_MONITOR=y \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -w" \
            modules 2>&1

      - name: Verify module vermagic
        run: |
          KO=$(find /tmp/rtl8188fu -name "rtl8188fu.ko" | head -1)
          if [ -z "$KO" ]; then
            echo "ERROR: rtl8188fu.ko not found!"
            exit 1
          fi
          echo "=== Module vermagic ==="
          strings "$KO" | grep vermagic
          echo ""
          echo "=== Expected localversion ==="
          echo "-${{ github.event.inputs.LOCALVERSION }}"
          echo ""
          echo "=== File size ==="
          ls -la "$KO"

      - name: Package module
        run: |
          KO=$(find /tmp/rtl8188fu -name "rtl8188fu.ko" | head -1)
          mkdir -p release/lkm
          mkdir -p release/system/etc/firmware/rtlwifi
          cp "$KO" release/lkm/
          cp /tmp/rtl8188fu/firmware/rtl8188fufw.bin release/system/etc/firmware/rtlwifi/ 2>/dev/null || true

          cat > release/module.prop << EOF
          id=wirelessksu
          name=WirelessKSU - RTL8188FU Monitor Mode
          version=${{ github.event.inputs.LOCALVERSION }}
          versionCode=100
          author=AbirHasanAHK
          description=RTL8188FU WiFi driver with monitor mode for USB adapters (Pixel 6 Pro)
          minApi=28
          EOF
          sed -i 's/^          //' release/module.prop

          cat > release/post-fs-data.sh << 'POSTFS'
          #!/system/bin/sh
          MODPATH=${0%/*}
          LOGFILE=/data/local/tmp/wirelessksu.log
          echo "=== WirelessKSU post-fs-data ===" > $LOGFILE
          echo "Kernel: $(uname -r)" >> $LOGFILE
          cp -f $MODPATH/system/etc/firmware/rtlwifi/rtl8188fufw.bin /vendor/firmware/rtlwifi/ 2>> $LOGFILE
          cp -f $MODPATH/system/etc/firmware/rtlwifi/rtl8188fufw.bin /lib/firmware/rtlwifi/ 2>> $LOGFILE
          for mod in r8188eu; do
              if lsmod | grep -q "$mod"; then
                  rmmod $mod 2>> $LOGFILE
              fi
          done
          if ! lsmod | grep -q rtl8188fu; then
              insmod $MODPATH/lkm/rtl8188fu.ko 2>> $LOGFILE
          fi
          echo "Modules:" >> $LOGFILE
          lsmod | grep -E "rtl|r8188|cfg80211|mac80211" >> $LOGFILE 2>&1
          POSTFS
          chmod 755 release/post-fs-data.sh

          cat > release/service.sh << 'SERVICE'
          #!/system/bin/sh
          MODPATH=${0%/*}
          while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 3; done
          cp -f $MODPATH/system/etc/firmware/rtlwifi/rtl8188fufw.bin /vendor/firmware/rtlwifi/ 2>/dev/null
          cp -f $MODPATH/system/etc/firmware/rtlwifi/rtl8188fufw.bin /lib/firmware/rtlwifi/ 2>/dev/null
          if ! lsmod | grep -q rtl8188fu; then
              insmod $MODPATH/lkm/rtl8188fu.ko 2>/dev/null
          fi
          for iface in /sys/class/net/wlan*; do
              [ -d "$iface" ] || continue
              ip link set $(basename "$iface") up 2>/dev/null
          done
          SERVICE
          chmod 755 release/service.sh

          echo "=== Package contents ==="
          find release/ -type f | sort

          cd release
          zip -9 -r $GITHUB_WORKSPACE/WirelessKSU.zip .

      - name: Upload module
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WirelessKSU-${{ github.event.inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          path: WirelessKSU.zip
          retention-days: 14
